name: CICD
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check username
        run: echo "Username='${{ secrets.DOCKER_USERNAME }}'"

      - name: Build backend Docker image
        run: docker build -t  ${{ secrets.DOCKER_USERNAME }}/toolnet-backend:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toolnet-frontend:latest .

      - name: Login to Dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolnet-backend:latest

      - name: Push frontend Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toolnet-frontend:latest


  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment Notice
        run: |
          echo "Docker images have been pushed successfully."
          echo "Deploy them to the local Kubernetes cluster manually:"
          echo "kubectl apply -f k8s/"

        


  

  

