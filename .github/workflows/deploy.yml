name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify and trigger deploys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: |
          export REACT_APP_API_URL="${REACT_APP_API_URL:-http://localhost:5001}"
          npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check backend syntax
        run: |
          node --check index.js
          node --check db.js
          find Routes models -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend

      - name: Trigger deploy hooks
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered frontend deploy hook."
          else
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not configured; skipping frontend deploy."
          fi

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Triggered backend deploy hook."
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; skipping backend deploy."
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
